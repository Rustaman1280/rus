<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>synthetix : 3D Procedural Terrain &amp; Voxel Engine</title>
  <meta name="description" content="Interactive 3D procedural terrain and voxel playground powered by @crustdev/synthetix. Real-time multi-octave fBm noise and biome color ramps in WebGL.">
  <link rel="icon" type="image/png" href="../image/crustdev-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(13, 17, 23, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --mint: #00ffaa;
      --violet: #8a5cf6;
      --cerulean: #38bdf8;
      --rim: #1e293b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 320px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      font-size: 13px;
    }
    .hud-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
    }
    .hud-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .hud-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--mint);
      background: rgba(0, 255, 170, 0.12);
      border: 1px solid rgba(0, 255, 170, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }
    .ctrl-group {
      margin-bottom: 14px;
    }
    .ctrl-label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    .ctrl-label span.val {
      color: var(--cerulean);
      font-weight: 600;
    }
    input[type=range] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.8);
      cursor: pointer;
    }
    select, button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }
    select:hover, button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    button.btn-primary {
      background: linear-gradient(135deg, rgba(138, 92, 246, 0.3), rgba(0, 255, 170, 0.3));
      border: 1px solid rgba(0, 255, 170, 0.4);
      color: #fff;
      font-weight: 600;
      margin-top: 4px;
    }
    button.btn-primary:hover {
      background: linear-gradient(135deg, rgba(138, 92, 246, 0.5), rgba(0, 255, 170, 0.5));
      border-color: var(--mint);
    }
    .stats-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .stats-card span.hi {
      color: var(--mint);
    }
    .hud-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .hud-footer a {
      color: var(--cerulean);
      text-decoration: none;
      transition: color 0.2s;
    }
    .hud-footer a:hover {
      color: var(--mint);
    }
    .floating-nav {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    .pill-link {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-link:hover {
      border-color: var(--mint);
      color: var(--mint);
      transform: translateY(-2px);
    }
    @media (max-width: 640px) {
      .hud-panel {
        width: calc(100vw - 40px);
        max-height: 48vh;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-panel">
    <div class="hud-header">
      <img src="../image/crustdev-logo.png" alt="crustdev" class="hud-logo">
      <div>
        <div class="hud-title">synthetix 3D</div>
        <div class="hud-badge">@crustdev/synthetix v1.0.0</div>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>SEED</span>
        <span class="val" id="val-seed">482917</span>
      </div>
      <button id="btn-reseed" class="btn-primary">Randomize Terrain Seed</button>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>OCTAVES (FBM)</span>
        <span class="val" id="val-octaves">4</span>
      </div>
      <input type="range" id="rng-octaves" min="1" max="6" step="1" value="4">
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>PERSISTENCE</span>
        <span class="val" id="val-persistence">0.50</span>
      </div>
      <input type="range" id="rng-persistence" min="0.1" max="0.9" step="0.05" value="0.5">
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>HEIGHT SCALE</span>
        <span class="val" id="val-height">18</span>
      </div>
      <input type="range" id="rng-height" min="4" max="36" step="1" value="18">
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>BIOME PALETTE</span>
      </div>
      <select id="sel-biome">
        <option value="abyssal" selected>Abyssal (crustdev Core)</option>
        <option value="caldera">Caldera (Volcanic)</option>
        <option value="boreal">Boreal (Permafrost)</option>
        <option value="dune">Dune (Desert)</option>
        <option value="verdant">Verdant (Continental)</option>
      </select>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">
        <span>RENDER MODE</span>
      </div>
      <select id="sel-mode">
        <option value="surface" selected>Shaded Surface</option>
        <option value="wireframe">Wireframe Grid</option>
        <option value="points">Point Cloud</option>
      </select>
    </div>

    <div class="stats-card">
      <div>Resolution: <span class="hi">64 x 64</span> grid</div>
      <div>Vertices: <span class="hi">4,225</span></div>
      <div>Triangles: <span class="hi">8,192</span></div>
      <div>Sample Time: <span class="hi" id="stat-time">0 ms</span></div>
    </div>

    <div class="hud-footer">
      <a href="https://rus.my.id">&larr; rus.my.id</a>
      <a href="https://www.npmjs.com/package/@crustdev/synthetix" target="_blank" rel="noopener">NPM Package &rarr;</a>
    </div>
  </div>

  <div class="floating-nav">
    <a href="https://crusts.dev" target="_blank" class="pill-link">
      <span>crusts.dev</span>
    </a>
    <a href="https://github.com/Rustaman1280" target="_blank" class="pill-link">
      <span>GitHub</span>
    </a>
  </div>

  <script>
    // --- Embedded synthetix Mathematical Core ---
    class SynthetixPRNG {
      constructor(seed = 482917) {
        this.s0 = (seed >>> 0) || 12345;
        this.s1 = ((seed * 1664525 + 1013904223) >>> 0) || 67890;
      }
      next() {
        let s1 = this.s0;
        const s0 = this.s1;
        this.s0 = s0;
        s1 ^= s1 << 23;
        this.s1 = (s1 ^ s0 ^ (s1 >>> 17) ^ (s0 >>> 26)) >>> 0;
        return (this.s1 + s0) >>> 0;
      }
      nextFloat() {
        return (this.next() >>> 0) / 4294967296.0;
      }
      buildPermutationTable() {
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(this.nextFloat() * (i + 1));
          const tmp = p[i];
          p[i] = p[j];
          p[j] = tmp;
        }
        const perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
        return perm;
      }
    }

    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function lerp(a, b, t) { return a + t * (b - a); }
    function grad2(hash, x, y) {
      const h = hash & 3;
      const u = h < 2 ? x : y;
      const v = h < 2 ? y : x;
      return (h & 1 ? -u : u) + (h & 2 ? -v : v);
    }

    class SynthetixNoise {
      constructor(seed = 482917) {
        this.reseed(seed);
      }
      reseed(seed) {
        const prng = new SynthetixPRNG(seed);
        this.perm = prng.buildPermutationTable();
      }
      perlin2D(x, y) {
        const xi = Math.floor(x) & 255;
        const yi = Math.floor(y) & 255;
        const xf = x - Math.floor(x);
        const yf = y - Math.floor(y);
        const u = fade(xf);
        const v = fade(yf);
        const aa = this.perm[this.perm[xi] + yi];
        const ab = this.perm[this.perm[xi] + yi + 1];
        const ba = this.perm[this.perm[xi + 1] + yi];
        const bb = this.perm[this.perm[xi + 1] + yi + 1];
        const x1 = lerp(grad2(aa, xf, yf), grad2(ba, xf - 1, yf), u);
        const x2 = lerp(grad2(ab, xf, yf - 1), grad2(bb, xf - 1, yf - 1), u);
        return lerp(x1, x2, v);
      }
      fbm2D(x, y, octaves = 4, persistence = 0.5, lacunarity = 2.0) {
        let total = 0;
        let frequency = 1;
        let amplitude = 1;
        let maxValue = 0;
        for (let i = 0; i < octaves; i++) {
          total += this.perlin2D(x * frequency, y * frequency) * amplitude;
          maxValue += amplitude;
          amplitude *= persistence;
          frequency *= lacunarity;
        }
        const normalized = (total / maxValue + 1) * 0.5;
        return Math.max(0, Math.min(1, normalized));
      }
    }

    const BiomePalettes = {
      abyssal: [
        { elevation: 0.0, rgb: [4, 6, 14] },
        { elevation: 0.3, rgb: [18, 12, 38] },
        { elevation: 0.55, rgb: [48, 24, 82] },
        { elevation: 0.75, rgb: [106, 64, 247] },
        { elevation: 0.9, rgb: [0, 255, 170] },
        { elevation: 1.0, rgb: [230, 255, 250] },
      ],
      caldera: [
        { elevation: 0.0, rgb: [48, 8, 6] },
        { elevation: 0.22, rgb: [168, 36, 12] },
        { elevation: 0.4, rgb: [42, 28, 26] },
        { elevation: 0.62, rgb: [78, 68, 62] },
        { elevation: 0.82, rgb: [132, 118, 98] },
        { elevation: 1.0, rgb: [224, 210, 180] },
      ],
      boreal: [
        { elevation: 0.0, rgb: [14, 32, 48] },
        { elevation: 0.3, rgb: [48, 78, 86] },
        { elevation: 0.46, rgb: [86, 108, 78] },
        { elevation: 0.68, rgb: [36, 64, 48] },
        { elevation: 0.86, rgb: [168, 178, 176] },
        { elevation: 1.0, rgb: [232, 238, 240] },
      ],
      dune: [
        { elevation: 0.0, rgb: [72, 42, 22] },
        { elevation: 0.28, rgb: [168, 108, 48] },
        { elevation: 0.52, rgb: [206, 164, 92] },
        { elevation: 0.74, rgb: [176, 122, 68] },
        { elevation: 0.9, rgb: [132, 86, 52] },
        { elevation: 1.0, rgb: [92, 64, 42] },
      ],
      verdant: [
        { elevation: 0.0, rgb: [18, 52, 92] },
        { elevation: 0.35, rgb: [32, 98, 138] },
        { elevation: 0.58, rgb: [214, 196, 132] },
        { elevation: 0.72, rgb: [52, 132, 72] },
        { elevation: 1.0, rgb: [36, 78, 48] },
      ]
    };

    function evaluateBiome(t, paletteKey) {
      const stops = BiomePalettes[paletteKey] || BiomePalettes.abyssal;
      const clamped = Math.max(0, Math.min(1, t));
      if (clamped <= stops[0].elevation) return stops[0].rgb;
      if (clamped >= stops[stops.length - 1].elevation) return stops[stops.length - 1].rgb;
      for (let i = 0; i < stops.length - 1; i++) {
        const s0 = stops[i];
        const s1 = stops[i + 1];
        if (clamped >= s0.elevation && clamped <= s1.elevation) {
          const factor = (clamped - s0.elevation) / (s1.elevation - s0.elevation);
          return [
            s0.rgb[0] + factor * (s1.rgb[0] - s0.rgb[0]),
            s0.rgb[1] + factor * (s1.rgb[1] - s0.rgb[1]),
            s0.rgb[2] + factor * (s1.rgb[2] - s0.rgb[2]),
          ];
        }
      }
      return [128, 128, 128];
    }

    // --- Three.js Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090e);
    scene.fog = new THREE.FogExp2(0x07090e, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(50, 45, 65);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.target.set(0, 0, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(40, 60, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x8a5cf6, 0.8);
    rimLight.position.set(-40, 20, -40);
    scene.add(rimLight);

    const mintFill = new THREE.PointLight(0x00ffaa, 0.5, 120);
    mintFill.position.set(0, -10, 0);
    scene.add(mintFill);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(100, 50, 0x1e293b, 0x0f172a);
    gridHelper.position.y = -0.5;
    scene.add(gridHelper);

    // Terrain Mesh State
    const GRID_SIZE = 64;
    const WORLD_SIZE = 70;
    let seed = 482917;
    let octaves = 4;
    let persistence = 0.5;
    let heightScale = 18;
    let biomeKey = 'abyssal';
    let renderMode = 'surface';

    const noiseEngine = new SynthetixNoise(seed);

    let geometry = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, GRID_SIZE, GRID_SIZE);
    geometry.rotateX(-Math.PI / 2);

    const surfaceMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.75,
      metalness: 0.15,
      flatShading: false,
    });

    const wireframeMaterial = new THREE.MeshBasicMaterial({
      vertexColors: true,
      wireframe: true,
    });

    const pointsMaterial = new THREE.PointsMaterial({
      vertexColors: true,
      size: 1.5,
      sizeAttenuation: true,
    });

    let terrainMesh = new THREE.Mesh(geometry, surfaceMaterial);
    terrainMesh.castShadow = true;
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    function updateTerrain() {
      const t0 = performance.now();
      const pos = geometry.attributes.position;
      const count = pos.count;
      const colors = new Float32Array(count * 3);

      const freqScale = 0.045;

      for (let i = 0; i < count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);

        // Sample fBm noise
        const elevation = noiseEngine.fbm2D(
          (x + 500) * freqScale,
          (z + 500) * freqScale,
          octaves,
          persistence,
          2.0
        );

        const y = Math.pow(elevation, 1.3) * heightScale;
        pos.setY(i, y);

        // Biome Color Ramp
        const rgb = evaluateBiome(elevation, biomeKey);
        colors[i * 3] = rgb[0] / 255;
        colors[i * 3 + 1] = rgb[1] / 255;
        colors[i * 3 + 2] = rgb[2] / 255;
      }

      pos.needsUpdate = true;
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.computeVertexNormals();

      const elapsed = Math.round(performance.now() - t0);
      document.getElementById('stat-time').textContent = elapsed + ' ms';
    }

    function applyRenderMode() {
      scene.remove(terrainMesh);
      if (renderMode === 'surface') {
        terrainMesh = new THREE.Mesh(geometry, surfaceMaterial);
      } else if (renderMode === 'wireframe') {
        terrainMesh = new THREE.Mesh(geometry, wireframeMaterial);
      } else if (renderMode === 'points') {
        terrainMesh = new THREE.Points(geometry, pointsMaterial);
      }
      terrainMesh.castShadow = true;
      terrainMesh.receiveShadow = true;
      scene.add(terrainMesh);
    }

    // --- DOM Event Listeners ---
    document.getElementById('btn-reseed').addEventListener('click', () => {
      seed = Math.floor(Math.random() * 900000) + 100000;
      document.getElementById('val-seed').textContent = seed;
      noiseEngine.reseed(seed);
      updateTerrain();
    });

    document.getElementById('rng-octaves').addEventListener('input', (e) => {
      octaves = parseInt(e.target.value, 10);
      document.getElementById('val-octaves').textContent = octaves;
      updateTerrain();
    });

    document.getElementById('rng-persistence').addEventListener('input', (e) => {
      persistence = parseFloat(e.target.value);
      document.getElementById('val-persistence').textContent = persistence.toFixed(2);
      updateTerrain();
    });

    document.getElementById('rng-height').addEventListener('input', (e) => {
      heightScale = parseFloat(e.target.value);
      document.getElementById('val-height').textContent = heightScale;
      updateTerrain();
    });

    document.getElementById('sel-biome').addEventListener('change', (e) => {
      biomeKey = e.target.value;
      updateTerrain();
    });

    document.getElementById('sel-mode').addEventListener('change', (e) => {
      renderMode = e.target.value;
      applyRenderMode();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial render
    updateTerrain();

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
